<!doctype html>
<html lang="{{ page.lang | default: 'fr' }}">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>{{ page.title }} - {{ site.title }}</title>
    <meta name="description" content="{{ site.description }}" />
    <style>
      :root {
        color-scheme: light dark;
        --background: #15120f;
        --panel: #211d18;
        --text: #f4ecd8;
        --muted: #cbbf9c;
        --accent: #d7c48b;
        --line: #4a3b22;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      main {
        width: min(820px, calc(100% - 40px));
        margin: 0 auto;
        padding: 36px 0 48px;
      }

      article {
        padding: 28px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
      }

      h1 {
        margin: 0 0 8px;
        color: var(--accent);
        font-size: clamp(28px, 6vw, 42px);
        line-height: 1.05;
      }

      h2 {
        margin: 26px 0 10px;
        color: var(--accent);
        font-size: 18px;
      }

      p,
      li {
        line-height: 1.6;
      }

      p {
        margin: 0 0 14px;
      }

      ul {
        margin: 0 0 14px;
        padding-left: 20px;
      }

      code,
      a {
        color: var(--accent);
      }

      .updated {
        color: var(--muted);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <main>
      <article>
        <h1>{{ page.title }}</h1>
        {{ content }}
      </article>
    </main>
  </body>
</html>
